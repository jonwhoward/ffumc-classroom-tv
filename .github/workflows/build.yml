name: Build classroom TV app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-28" "build-tools;34.0.0" > /dev/null
      - name: Build
        run: VERSION_CODE=${{ github.run_number }} VERSION_NAME=1.${{ github.run_number }} ./app/build.sh
      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest app/build/ffumc-classroom-tv.apk tv/install.sh tv/classroom.conf \
            --title "Classroom TV app (build ${{ github.run_number }})" \
            --notes "Built from ${GITHUB_SHA::7}. Download ffumc-classroom-tv.apk, install.sh and classroom.conf into ~/ffumc-tv on the Mac."
