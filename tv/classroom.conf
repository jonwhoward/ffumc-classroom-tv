# Franklin First classroom TV settings. The same file goes on every TV;
# install.sh fills in the room line for each one.
room=
email=tech@franklinfumc.org
# Weather card location: latitude,longitude|name shown on the card
weather=35.9251,-86.8689|Franklin, TN

# Guest Wi-Fi card with a QR code: network|password
wifi=FFUMC_Guest|Guest123
# Shown with the email while Sunday classes meet
desk=Media Room

# button=HDMI port|big label|small line|color
button=1|iPad or Laptop|Phones work too, with an adapter from the Media Room|#7A2426
button=2|DVD Player|Plays DVDs and Blu-ray discs|#1F4A7C

# A room can list its own buttons; they replace the two above in that room only.
# button@ROOM=port|label|small line|color|zoom   (zoom 1.33 enlarges the picture to fill the screen)
button@B138=1|iPad or Laptop|Phones work too, with an adapter from the Media Room|#7A2426
button@B138=2|DVD Player|Plays DVDs (not Blu-ray)|#1F4A7C
# B135: one cable on HDMI 1 for everything (a second input comes later).
# Per-button zoom was tried Oct 25, 2026: Fire OS ignores app zoom on HDMI, and Amazon's own
# player (where the TV's zoom works) needs com.amazon.tv.permission.TUNE_INPUT, held only by Amazon apps.
button@B135=1|iPad or Laptop|One cable for both. Phones work too, with an adapter|#7A2426

